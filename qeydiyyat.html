<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-dark text-white text-center py-3">
    <h1>KampusYemək</h1>
    <nav>
        <a href="sifaris.html">Sifariş</a>
        <a href="sebet.html">Səbət</a>
        <a href="giris.html">Giriş</a>
        <a href="qeydiyyat.html" class="active">Qeydiyyat</a>
        <a href="elaqe.html">Əlaqə</a>
    </nav>
</header>

<main class="container my-5" style="max-width: 500px;">
    <h2>Qeydiyyat</h2>
    <form action="giris.html">
        <div class="mb-3">
            <label class="form-label">Ad, Soyad</label>
            <input type="text" class="form-control" placeholder="Adınızı və soyadınızı daxil edin" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Tələbə ID</label>
            <input type="text" inputmode="numeric" pattern="[0-9]+" title="Yalnız rəqəm daxil edin" class="form-control" placeholder="Məs: 20251234" required>
            <div class="form-text">Yalnız rəqəmlər</div>
        </div>
        <div class="mb-3">
            <label class="form-label">E-poçt</label>
            <input type="email" class="form-control" placeholder="E-poçtunuzu daxil edin" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Şifrə</label>
            <input type="password" class="form-control" placeholder="Şifrə yaradın" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Şifrənin təkrarı</label>
            <input type="password" class="form-control" placeholder="Şifrəni təkrar daxil edin" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Qeydiyyatdan keç</button>
    </form>

    <div class="mt-3">
        Hesabınız var? <a href="giris.html">Daxil olun</a>
    </div>
</main>

<footer>
    <p class="mb-0">&copy; 2026 KampusYemək. Bütün hüquqlar qorunur.</p>
</footer>
</body>
</html>
