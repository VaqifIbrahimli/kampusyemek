<main class="container my-5">

    <div class="row g-4">

                <div class="mb-3">
                    <label class="form-label">Mesaj</label>
                    <textarea class="form-control" rows="4" placeholder="Mesajınızı yazın" required></textarea>
                </div>
                <button type="submit" class="btn btn-dark">Göndər</button>
